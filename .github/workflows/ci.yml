name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check src scripts && ruff format --check src scripts
      - name: Smoke test (CLI on the sample article)
        run: python -m textSummarizer.cli examples/sample_article.txt --compare
