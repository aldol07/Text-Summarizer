[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-summarizer"
version = "0.1.0"
description = "Classical NLP extractive summarizers and an LSTM pointer-generator, served with FastAPI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "aldol07" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "nltk>=3.8",
    "PyYAML>=6.0",
    "onnxruntime>=1.17",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.16", "onnxscript>=0.1", "ml-dtypes>=0.5,<0.6", "psutil>=5.9"]
eval = ["pandas>=2.0", "pyarrow>=14", "huggingface_hub>=0.20", "matplotlib>=3.8", "rouge-score>=0.1.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
textsummarizer = "textSummarizer.cli:main"

[project.urls]
Repository = "https://github.com/aldol07/Text-Summarizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
